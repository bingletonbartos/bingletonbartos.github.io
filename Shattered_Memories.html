  for(let i=0;i<8;i++){
   const yy=((i*37+Math.floor(progress*760))%H);

   scareCtx.fillRect(0,yy,W,1+(i%3));
  }
  scareCtx.restore();
 }

function renderGame(){const shake=shakeAmt*3,dx=(rand()-.5)*shake,dy=(rand()-.5)*shake;ctx.save();ctx.translate(dx,dy);renderBase();drawLamps();drawSprites();drawDust();postEffects();ctx.restore();drawScare();}
function updateHud(){roomLabel.textContent='ROOM '+String(roomNum).padStart(3,'0')+(insideSideRoom()?' · SIDE ROOM':'');mapLabel.textContent=MAP_SHORT[activeMapTheme]+(insideSideRoom()?' · SIDE ROOM':downstairs?' · LOWER LEVEL':'');coinLabel.textContent='COINS '+coinText();healthFill.style.width=Math.max(0,health)+'%';batteryFill.style.width=Math.max(0,battery/maxBattery*100)+'%';const labels=['BATTERY','FLARE','BANDAGE','KEY','CARD'],counts=[invBattery,invFlare,invBandage,invKey,invCard];itemLabel.textContent='ITEM '+labels[selectedItem]+' ×'+counts[selectedItem];statusRight.textContent=(lampOn?'LANTERN ON  ':'')+(flareTimer>0?'FLARE LIT  ':'')+(hiddenObj>=0?'HIDDEN':'')+(showPerf?'FPS '+fps:'');const pr=getPrompt();promptEl.textContent=pr;promptEl.style.opacity=pr?'1':'0'}

// A light procedural audio bed. It starts only after the user's first action.
let audioCtx=null,masterGain=null,humOsc=null,humGain=null,lastStep=0;
function wakeAudio(){if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return}try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=(profile.volume??70)/100*.25;masterGain.connect(audioCtx.destination);humOsc=audioCtx.createOscillator();humOsc.type='sawtooth';humOsc.frequency.value=41;humGain=audioCtx.createGain();humGain.gain.value=.022;humOsc.connect(humGain).connect(masterGain);humOsc.start();const hum2=audioCtx.createOscillator(),g2=audioCtx.createGain();hum2.type='sine';hum2.frequency.value=54;g2.gain.value=.012;hum2.connect(g2).connect(masterGain);hum2.start()}catch(e){}}
function playTone(freq,duration,gain=.06,type='sine'){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g).connect(masterGain);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function audioTick(dt){if(!audioCtx||screen!=='game'||hiddenObj>=0)return;const moving=keys.has('KeyW')||keys.has('KeyS')||keys.has('KeyA')||keys.has('KeyD');if(moving){lastStep-=dt;if(lastStep<=0){lastStep=(keys.has('ShiftLeft')||keys.has('ShiftRight'))?.28:.43;playTone(55+rand()*18,.045,.025,'triangle')}}if(humGain){const threat=creActive?Math.max(0,1-Math.hypot(creX-px,creY-py)/14):0;humGain.gain.setTargetAtTime(.016+threat*.045+(globalFlicker>.05?.012:0),audioCtx.currentTime,.2)}}
function setScreen(next){screen=next;menuSelection=0;renderPanel();if(next==='game')wakeAudio()}
function renderPanel(){const show=screen!=='game';panelShade.classList.toggle('show',show);menuArt.style.display=screen==='title'?'block':'none';if(!show)return;let title='',sub='',foot='UP / DOWN SELECT · ENTER CONFIRM · ESC BACK',items=[];
 const add=(label,meta,action,disabled=false)=>items.push({label,meta,action,disabled});
 if(screen==='title'){title='SHATTERED MEMORIES';sub='PROCEDURAL SURVIVAL HORROR · NO SIGNAL';if(profile.run?.active)add('CONTINUE DESCENT','ROOM '+String(profile.run.room||1).padStart(3,'0'),()=>continueRun());add('NEW DESCENT','ENTER THE WARD',()=>startFreshRun(true));add('THE SHOP','SPEND RECOVERED COINS',()=>goSub('shop'));add('DESCENT ROUTES','FIVE ENVIRONMENTS',()=>goSub('maps'));add('FIELD INDEX','RECOVERED RECORDS',()=>goSub('index'));add('SETTINGS','AUDIO · LOOK · DETAIL',()=>goSub('settings'));add('CREDITS','',()=>goSub('credits'));foot='W FORWARD · S BACK · A/D STRAFE · MOUSE LOOK · E INTERACT · F LANTERN · SHIFT RUN'}
 if(screen==='pause'){title='PAUSED';sub='ROOM '+roomNum+' · COINS '+coinText();add('RESUME','RETURN TO THE HALLS',()=>{setScreen('game');saveRunSnapshot()});add('THE SHOP','',()=>goSub('shop'));add('DESCENT ROUTES','',()=>goSub('maps'));add('FIELD INDEX','',()=>goSub('index'));add('SETTINGS','',()=>goSub('settings'));add('RESTART RUN','BEGIN AGAIN',()=>{profile.run=null;saveProgress();startFreshRun(true)});add('CREDITS','',()=>goSub('credits'));add('MAIN MENU','SAVE AND RETURN',()=>{saveRunSnapshot();setScreen('title')})}
 if(screen==='gameover'){title='GAME OVER';sub='ROOM '+roomNum+' · COINS '+coinText();add('RESTART DESCENT','TRY AGAIN',()=>startFreshRun(true));add('THE SHOP','',()=>goSub('shop'));add('DESCENT ROUTES','',()=>goSub('maps'));add('FIELD INDEX','',()=>goSub('index'));add('MAIN MENU','',()=>setScreen('title'));foot='THE WARD DOES NOT REMEMBER YOU'}
 if(screen==='shop'){title='THE SHOP';sub='COINS '+coinText()+' · UPGRADES PERSIST BETWEEN DESCENTS';SHOP.forEach((s,i)=>{const owned=i<5&&(profile.upgrades&s[3]);const stock=i===5?profile.stockBattery:i===6?profile.stockFlare:i===7?profile.stockBandage:0;add(s[0],owned?'OWNED':i>=5?`${s[2]}C · STASH ${stock}`:`${s[2]}C`,()=>{buyShop(i)},owned)});add('BACK','',()=>setScreen(screenReturn||'title'));foot='SELECT AN ITEM TO PURCHASE · COINS ARE KEPT AFTER A RUN'}
 if(screen==='maps'){title='DESCENT ROUTES';sub='SELECT AN ENVIRONMENT';MAP_NAMES.forEach((m,i)=>{const unlocked=(profile.mapUnlocks&(1<<i))!==0;add(m,(i===activeMapTheme&&unlocked?'ACTIVE · ':unlocked?'UNLOCKED · ':MAP_COST[i]+'C · ')+MAP_DESCRIPTIONS[i],()=>chooseMap(i),false)});add('BACK','',()=>setScreen(screenReturn||'title'));foot='NEW DESCENTS USE THE SELECTED ROUTE'}
 if(screen==='index'){title='FIELD INDEX';const recovered=INDEX_NAMES.filter((_,i)=>profile.discoveries&(1<<i)).length;sub=`RECOVERED ${recovered} OF 23 · ENTRY ${String(indexSelection+1).padStart(2,'0')}`;const found=(profile.discoveries&(1<<indexSelection))!==0;add('‹ PREVIOUS ENTRY','',()=>{indexSelection=(indexSelection+22)%23;renderPanel()});add(found?INDEX_NAMES[indexSelection]:'UNKNOWN ENTRY',found?INDEX_NOTES[indexSelection]:'SURVIVE ENCOUNTERS AND SEARCH OBJECTS TO RECOVER RECORDS',()=>{indexSelection=(indexSelection+1)%23;renderPanel()});add('NEXT ENTRY ›','',()=>{indexSelection=(indexSelection+1)%23;renderPanel()});add('BACK','',()=>setScreen(screenReturn||'title'));foot='THE WARD LEAVES RECORDS IN ITS OBJECTS AND CREATURES'}
 if(screen==='settings'){title='SETTINGS';sub=`DEEPEST ROOM ${profile.bestRoom||0} · RUNS ${profile.runs||0} · DEATHS ${profile.deaths||0} · ROOMS CLEARED ${profile.roomsCleared||0}`;add('VOLUME',`${profile.volume}%`,()=>{profile.volume=Math.max(0,Math.min(100,profile.volume+10));if(masterGain)masterGain.gain.setTargetAtTime(profile.volume/100*.25,audioCtx.currentTime,.05);saveProgress();renderPanel()});add('LOOK SENSITIVITY',`${profile.sensitivity}%`,()=>{profile.sensitivity=Math.min(160,profile.sensitivity+10);lookSensitivity=profile.sensitivity/100;saveProgress();renderPanel()});add('RENDER DISTANCE',['LOW','MEDIUM','HIGH'][profile.detail],()=>{profile.detail=(profile.detail+1)%3;renderDistance=[10,15,19][profile.detail];saveProgress();renderPanel()});add('PERFORMANCE OVERLAY',profile.showPerf?'ON':'OFF',()=>{profile.showPerf=!profile.showPerf;showPerf=profile.showPerf;saveProgress();renderPanel()});add('RESET PROGRESS',resetConfirm?'PRESS AGAIN TO ERASE':'ERASE ALL',()=>{if(!resetConfirm){resetConfirm=1;setMsg('PRESS RESET AGAIN TO CONFIRM')}else{profile={...defaults};activeMapTheme=0;resetConfirm=0;saveProgress();setScreen('title')}});add('BACK','',()=>setScreen(screenReturn||'title'));foot='VOLUME, LOOK SENSITIVITY, AND DETAIL CAN BE ADJUSTED HERE'}
 if(screen==='credits'){title='SHATTERED MEMORIES';sub='A PROCEDURAL SURVIVAL HORROR GAME';add('WEB PORT','BROWSER BUILD · CANVAS RAYCASTER',()=>{} ,true);add('PSP EDITION','NATIVE PSPSDK / GU RENDERER',()=>{},true);add('BACK','',()=>setScreen(screenReturn||'title'));foot='MAZES · FURNITURE · CREATURES · NO SIGNAL'}
 panelTitle.textContent=title;panelSub.textContent=sub;panelFoot.textContent=foot;panelButtons.innerHTML='';items.forEach((it,i)=>{const b=document.createElement('button');b.className='panelBtn'+(i===menuSelection?' selected':'');b.disabled=it.disabled;b.innerHTML=`<span>${it.label}</span><span class="btnMeta">${it.meta||''}</span>`;b.addEventListener('click',()=>{if(it.disabled)return;menuSelection=i;it.action()});panelButtons.appendChild(b)});panelButtons.dataset.count=items.length;panelButtons._items=items;
}
let screenReturn='title';
function goSub(s){screenReturn=screen;setScreen(s)}
function buyShop(i){const s=SHOP[i],owned=i<5&&(profile.upgrades&s[3]);if(owned){setMsg('ALREADY INSTALLED');return}if(profile.coins<s[2]){setMsg('NOT ENOUGH COINS');return}if(i>=5){const key=['stockBattery','stockFlare','stockBandage'][i-5];if(profile[key]>=99){setMsg('STASH FULL');return}profile[key]++}else profile.upgrades|=s[3];profile.coins-=s[2];saveProgress();setMsg('PURCHASE COMPLETE');renderPanel()}
function chooseMap(i){if(!(profile.mapUnlocks&(1<<i))){if(profile.coins<MAP_COST[i]){setMsg('NOT ENOUGH COINS');return}profile.coins-=MAP_COST[i];profile.mapUnlocks|=1<<i}profile.selectedMap=i;activeMapTheme=i;saveProgress();buildTextures(i);setMsg('ROUTE SELECTED · START A NEW DESCENT');renderPanel()}
function panelAdjust(dir){if(screen!=='settings')return;if(menuSelection===0){profile.volume=Math.max(0,Math.min(100,profile.volume+dir*10));if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(profile.volume/100*.25,audioCtx.currentTime,.05)}else if(menuSelection===1){profile.sensitivity=Math.max(60,Math.min(160,profile.sensitivity+dir*10));lookSensitivity=profile.sensitivity/100}else if(menuSelection===2){profile.detail=(profile.detail+dir+3)%3;renderDistance=[10,15,19][profile.detail]}else return;saveProgress();renderPanel()}
function panelMove(dir){const n=+(panelButtons.dataset.count||0);if(!n)return;menuSelection=(menuSelection+dir+n)%n;[...panelButtons.children].forEach((b,i)=>b.classList.toggle('selected',i===menuSelection));}
function panelActivate(){const b=panelButtons.children[menuSelection];if(b&&!b.disabled)b.click()}
function onKeyDown(e){const k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if(!keys.has(k))justPressed.add(k);keys.add(k);if(k==='Digit5'&&!e.repeat){profile.coins=696969696969;saveProgress();updateHud();renderPanel();setMsg('CHEAT ACCEPTED · 696,969,696,969 COINS');return}if(screen!=='game'){if(k==='ArrowUp'||k==='KeyW')panelMove(-1);if(k==='ArrowDown'||k==='KeyS')panelMove(1);if(k==='ArrowLeft')panelAdjust(-1);if(k==='ArrowRight')panelAdjust(1);if(k==='Enter'||k==='Space')panelActivate();if(k==='Escape'||k==='Backspace'){if(screen==='title')return;if(screen==='pause'){setScreen('game')}else setScreen(screenReturn||'title')}return}
 if(k==='Escape'){if(document.pointerLockElement===canvas)document.exitPointerLock();saveRunSnapshot();setScreen('pause');return}
 if(e.repeat)return;if(k==='KeyE')interact();if(k==='KeyF'){if(battery>0){lampOn=!lampOn;discoverEntry(17);setMsg(lampOn?'LANTERN ON':'LANTERN OFF');playTone(lampOn?740:260,.08,.04)}else setMsg('NO BATTERY · FIND ONE')}
 if(k==='Space'){e.preventDefault();useSelectedItem()}if(k==='KeyQ'){selectedItem=(selectedItem+4)%5;setMsg(['BATTERY','FLARE','BANDAGE','KEY','CARD'][selectedItem])}if(k==='KeyR'){selectedItem=(selectedItem+1)%5;setMsg(['BATTERY','FLARE','BANDAGE','KEY','CARD'][selectedItem])}if(k>='Digit1'&&k<='Digit4'){selectedItem=+k.slice(5)-1;setMsg(['BATTERY','FLARE','BANDAGE','KEY'][selectedItem])}wakeAudio()}
function onKeyUp(e){keys.delete(e.code);justPressed.delete(e.code)}
window.addEventListener('keydown',onKeyDown);window.addEventListener('keyup',onKeyUp);canvas.addEventListener('click',()=>{wakeAudio();if(screen==='game'&&canvas.requestPointerLock)canvas.requestPointerLock()});document.addEventListener('pointerlockchange',()=>{mouseLocked=document.pointerLockElement===canvas;canvas.style.cursor=mouseLocked?'none':'crosshair'});document.addEventListener('mousemove',e=>{if(mouseLocked&&screen==='game')ang+=e.movementX*.0022*lookSensitivity});
function drawMenuBackdrop(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#111718');g.addColorStop(.45,'#090d0e');g.addColorStop(1,'#030405');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<22;i++){const x=(i*73)%W;ctx.fillStyle=`rgba(145,112,78,${.018+(i%4)*.006})`;ctx.fillRect(x,0,1,H)}const glow=ctx.createRadialGradient(W*.5,H*.48,10,W*.5,H*.48,260);glow.addColorStop(0,'rgba(137,103,70,.11)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H)}
function updateFrame(now){let dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;fpsCount++;update(dt);if(screen==='game'){renderGame();if(now-hudTick>90){updateHud();hudTick=now}audioTick(dt)}else{scareCtx.setTransform(1,0,0,1,0,0);scareCtx.clearRect(0,0,W,H)}requestAnimationFrame(updateFrame)}

activeMapTheme=profile.selectedMap|0;maxBattery=(profile.upgrades&1)?160:100;battery=maxBattery;lookSensitivity=(profile.sensitivity||100)/100;renderDistance=profile.detail===0?10:profile.detail===2?19:15;showPerf=profile.showPerf|0;roomNum=1;downstairs=0;genRoom();screen='title';drawMenuBackdrop();renderPanel();updateHud();requestAnimationFrame(updateFrame);

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Softbody Crash Sandbox</title>
<style>
:root{--bg:#12171d;--fg:#eef2f5;--ac:#f0b429;--pn:#12171de6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#0d1116}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

#hud{left:10px;min-width:170px}#help{right:10px;max-width:220px}

</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="sp">0 km/h</div><div id="ps"></div><div id="dm"></div><div id="ev"></div></div>
<div id="help">A/D or ←/→ drive · Space brake · R respawn · V beam view · wheel to zoom. Side-view soft-body: every node and beam is simulated, nothing is anchored.</div>
<div id="bar"></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),$=i=>document.getElementById(i),G=9.81,DT=1/2000,K={},WX0=166,WX1=234,WY=1;
let W,H,D=1,S=34,vb=0;
function rs(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener('resize',rs);rs();
/* ---- terrain: key points + launch ramps + rough downhill ---- */
const KP=[[-80,0],[90,0],[150,-6],[166,-6],[169,5],[185,7],[212,7],[234,0],[262,0],[330,12],[420,40],[520,75],[600,95],[700,108],[770,110],[1500,110]],
RP=[[150,16,3.5],[380,12,3],[470,14,3.5],[560,16,4.5],[650,14,3],[1150,40,14]],X0=-80,TN=1580,T=new Float32Array(TN+1);
for(let i=0;i<=TN;i++){const x=X0+i;let y=110;
 for(let j=1;j<KP.length;j++)if(x<=KP[j][0]){const a=KP[j-1],b=KP[j];y=a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);break}
 for(const r of RP)if(x>=r[0]&&x<r[0]+r[1])y-=r[2]*(x-r[0])/r[1];
 if(x>262&&x<780)y+=.22*Math.sin(x*.8)+.15*Math.sin(x*2.1);T[i]=y}
const gy=x=>{const u=x-X0;if(u<=0)return T[0];if(u>=TN)return T[TN];const i=u|0,f=u-i;return T[i]*(1-f)+T[i+1]*f},
gs=x=>{let u=x-X0;u=u<0?0:u>TN-1?TN-1:u;const i=u|0;return T[i+1]-T[i]};
const CY=[[60,1.2],[78,.8],[300,1],[345,1.4],[410,1.1],[505,.9],[1000,.5],[1007,.5],[1014,.5],[1085,1.1],[1087,1.1]].map(([x,r])=>({x,y:gy(x)-r*.8,r}));
/* ---- crushers: hydraulic presses + side jaws ---- */
const CR=[{k:0,x:830,w:7,s:.8},{k:1,x:945,s:.6},{k:0,x:1045,w:6,s:1.1}];
let OB=[],BX=[];
function ub(t){const A=[];for(const c of CR){const g=gy(c.x),u=.5+.5*Math.sin(t*c.s);
 if(c.k)for(const s of[-1,1]){const gp=.4+4.6*u,x0=s<0?c.x-gp-2.5:c.x+gp;A.push([x0,g-9,x0+2.5,g+1,0])}
 else{const hg=.25+6.5*u*u;A.push([c.x-c.w/2,g-hg-5,c.x+c.w/2,g-hg,1])}}
 BX=A.map((b,i)=>{const o=OB[i]||b;return{x0:b[0],y0:b[1],x1:b[2],y1:b[3],ram:b[4],vx:(b[0]-o[0])/DT,vy:(b[1]-o[1])/DT}});OB=A}
/* ---- soft-body car: 63 parts ---- */
const C=['#e0a526','#2a2f36','rgba(150,205,230,.8)','#ffe9a0','#d83a34','#8a929a','#4d555e','#5c4b66','#6f7881','#c9d2d8','#7a8a52','#8a3f2f','#f3f3f0','#ff9d2e'];
const PD=[
['Engine',1.35,-.48,1.9,-.48,.4,7,120],['Gearbox',.75,-.4,1.2,-.4,.24,8,40],['Differential',-1.55,-.3,-1.25,-.3,.2,8,16],['Radiator',2,-.62,2,-.32,.07,9,8],['Fuel tank',-1.15,-.38,-.5,-.38,.26,10,25],['Battery',1.2,-.68,1.35,-.68,.12,5,10],['Airbox',1.6,-.7,1.85,-.7,.08,5,3],['Manifold',1.5,-.25,1.8,-.25,.07,5,6],['Alternator',1.45,-.3,1.6,-.3,.1,6,5],['Driveshaft',-1.3,-.2,.6,-.2,.06,5,9],['Exhaust pipe',-2,-.06,-.3,-.06,.05,5,8],['Muffler',-1.95,-.05,-1.45,-.05,.14,6,6],['Tailpipe',-2.14,-.1,-2,-.1,.06,5,1],['Spare tire',-1.95,-.5,-1.78,-.5,.3,1,12],['Seat F base',.2,-.5,.62,-.5,.12,11,10],['Seat F back',.2,-.55,.2,-.98,.13,11,8],['Seat R base',-.75,-.5,-.33,-.5,.12,11,10],['Seat R back',-.75,-.55,-.75,-.98,.13,11,8],['Dashboard',.9,-.82,1.25,-.82,.1,11,8],['Steering wheel',.75,-.95,.85,-.85,.05,5,3],['Skid plate',.6,-.1,1.3,-.1,.05,1,5],['Splitter',1.85,-.12,2.3,-.12,.04,1,3],['Diffuser',-2.3,-.12,-1.85,-.12,.04,1,3],
['Hood A',1.4,-.8,1.75,-.8,.1,0,10],['Hood B',1.75,-.8,2.12,-.8,.1,0,10],['Trunk A',-1.75,-.8,-1.4,-.8,.1,0,8],['Trunk B',-2.12,-.8,-1.75,-.8,.1,0,8],['Roof A',-.7,-1.3,0,-1.3,.08,0,8],['Roof B',0,-1.3,.7,-1.3,.08,0,8],['Door F',.15,-.45,.95,-.45,.44,0,16],['Door R',-.95,-.45,-.15,-.45,.44,0,16],['Fender F',1,-.5,1.85,-.5,.4,0,10],['Quarter R',-1.85,-.5,-1,-.5,.4,0,10],['Pillar A',1.4,-.74,.7,-1.25,.07,0,3],['Pillar B',0,-1.2,0,-.7,.07,0,3],['Pillar C',-1.4,-.74,-.7,-1.25,.07,0,3],['Rocker',-.9,-.18,.9,-.18,.08,1,5],['Bumper F',2.2,-.46,2.2,-.2,.14,1,12],['Bumper R',-2.2,-.46,-2.2,-.2,.14,1,12],['Spoiler',-2.15,-1,-1.8,-1,.05,0,3],['Roof rack',-.55,-1.4,.55,-1.4,.04,1,4],['Hood scoop',1.6,-.88,1.85,-.88,.06,1,2],
['Windshield',1.36,-.76,.74,-1.2,.05,2,6],['Rear glass',-1.36,-.76,-.74,-1.2,.05,2,5],['Window F',.12,-.95,.9,-.95,.26,2,4],['Window R',-.9,-.95,-.12,-.95,.26,2,4],
['Headlight',2.14,-.68,2.14,-.52,.1,3,2],['Taillight',-2.14,-.68,-2.14,-.52,.1,4,2],['Fog lamp',2.08,-.42,2.08,-.3,.07,3,1],['Indicator F',2.14,-.5,2.14,-.38,.06,13,1],['Indicator R',-2.14,-.5,-2.14,-.38,.06,13,1],['Mirror',.85,-.86,.98,-.86,.1,1,2],['Wiper',.85,-1,1.2,-.8,.025,5,1],['Antenna',-1.3,-.85,-1.35,-1.5,.02,1,1.2],['Handle F',.75,-.62,.88,-.62,.04,5,1],['Handle R',-.35,-.62,-.22,-.62,.04,5,1],['Fuel cap',-1.55,-.62,-1.42,-.62,.05,5,1],['Plate F',2.24,-.38,2.24,-.26,.03,12,1],['Plate R',-2.24,-.38,-2.24,-.26,.03,12,1],['Tow hook F',2.2,-.18,2.34,-.18,.04,5,2],['Tow hook R',-2.34,-.18,-2.2,-.18,.04,5,2]];
let N,Bm,PT,WH,FN,SK,bk=0,dirty=0,PA=[],ev=[],tr=[10,0,0],t=0,acc=0,last=performance.now();const cam={x:0,y:0};
const nd=(x,y,m,bu=1.5,mu=.55,tire=0)=>{const n={x,y,vx:0,vy:0,fx:0,fy:0,m,bu,mu,tire,w:0};N.push(n);return n},
bm=(a,b,k,c,o={})=>{const L=Math.hypot(b.x-a.x,b.y-a.y),e={a,b,L,L0:L,k,c,y:0,mx:1e9,q:0,t:1,...o};Bm.push(e);return e};
function build(px,py){
 N=[];Bm=[];PT=[];WH=[];FN=[];bk=0;dirty=0;
 const CX=[-2.1,-1.4,-.7,0,.7,1.4,2.1];
 CX.forEach(x=>FN.push(nd(px+x,py-.15,28)));
 CX.forEach(x=>FN.push(nd(px+x,py-.72,26)));
 [-.7,0,.7].forEach(x=>FN.push(nd(px+x,py-1.25,20)));
 for(let i=0;i<17;i++)for(let j=i+1;j<17;j++){const d=Math.hypot(FN[i].x-FN[j].x,FN[i].y-FN[j].y);if(d<.95)bm(FN[i],FN[j],5e5,500,{y:.035,mx:d*1.55,t:0})}
 SK=Bm.slice();
 [-1.4,1.4].forEach((wx,wi)=>{
  const h=nd(px+wx,py,14,2,.5),R=[];
  for(let i=0;i<12;i++){const a=i*Math.PI/6;R.push(nd(px+wx+.33*Math.cos(a),py+.33*Math.sin(a),2.2,2.4,1.3,1))}
  for(let i=0;i<12;i++){bm(h,R[i],1e5,120);bm(R[i],R[(i+1)%12],1.5e5,150);bm(R[i],R[(i+2)%12],8e4,100)}
  const arm=bm(h,FN[wi?4:2],6e5,800,{y:.06,mx:1.1,t:2}),st=bm(FN[wi?12:8],h,8e4,5000,{q:3.2e6,mx:1.2,t:2});
  WH.push({h,R,arm,st,om:0});PT.push({n:wi?'Wheel F':'Wheel R',w:1,nodes:[h,...R],bolts:[arm,st],att:1})});
 for(const[nm,x1,y1,x2,y2,th,c,m]of PD){
  const hm=Math.max(.6,m/2),a=nd(px+x1,py+y1,hm,.8,.5),b=nd(px+x2,py+y2,hm,.8,.5),k=Math.min(2.5e5,2e4+4e3*m),bolts=[];
  bm(a,b,2e5,200);
  for(const n of[a,b]){const s=FN.slice().sort((u,v)=>Math.hypot(u.x-n.x,u.y-n.y)-Math.hypot(v.x-n.x,v.y-n.y));
   for(let i=0;i<2;i++){const L=Math.hypot(s[i].x-n.x,s[i].y-n.y);bolts.push(bm(s[i],n,k,.6*Math.sqrt(k*hm),{mx:L+.12+.0015*m}))}}
  PT.push({n:nm,a,b,th,c,bolts,att:1})}
}
function spawn(x,dy,t0){tr=[x,dy,t0];t=t0;OB=[];PA=[];ev=[];const py=Math.min(gy(x-1.4),gy(x),gy(x+1.4),gy(x+2.2),gy(x-2.2))-.48+dy;build(x,py);cam.x=x;cam.y=py;ub(t)}
/* ---- physics ---- */
function resp(n,nx,ny){const vn=n.vx*nx+n.vy*ny;if(vn>=0)return;n.vx-=vn*nx;n.vy-=vn*ny;const tx=-ny,ty=nx;let vt=n.vx*tx+n.vy*ty;vt-=Math.sign(vt)*Math.min(Math.abs(vt),-vn*n.mu);n.vx=vt*tx;n.vy=vt*ty}
function col(n){
 const g=gy(n.x);
 if(n.y>g){const s=gs(n.x),l=Math.hypot(1,s),nx=s/l,ny=-1/l,p=(n.y-g)/l;n.x+=nx*p;n.y+=ny*p;resp(n,nx,ny)}
 for(const c of CY){const dx=n.x-c.x,dy=n.y-c.y,d2=dx*dx+dy*dy;if(d2<c.r*c.r){const d=Math.sqrt(d2)||1e-4,nx=dx/d,ny=dy/d;n.x=c.x+nx*c.r;n.y=c.y+ny*c.r;resp(n,nx,ny)}}
 for(const b of BX)if(n.x>b.x0&&n.x<b.x1&&n.y>b.y0&&n.y<b.y1){
  const l=n.x-b.x0,r=b.x1-n.x,u=n.y-b.y0,d=b.y1-n.y,m=Math.min(l,r,u,d);
  if(m===l){n.x=b.x0;n.vx=Math.min(n.vx,b.vx)}else if(m===r){n.x=b.x1;n.vx=Math.max(n.vx,b.vx)}
  else if(m===u){n.y=b.y0;n.vy=Math.min(n.vy,b.vy)}else{n.y=b.y1;n.vy=Math.max(n.vy,b.vy)}}}
function skin(){for(const b of SK){if(b.dead)continue;const a=b.a,e=b.b,ex=e.x-a.x,ey=e.y-a.y,l2=ex*ex+ey*ey||1e-6;
 for(const c of CY){if(Math.abs(c.x-a.x)>c.r+3)continue;let u=((c.x-a.x)*ex+(c.y-a.y)*ey)/l2;u=u<0?0:u>1?1:u;
  const dx=a.x+ex*u-c.x,dy=a.y+ey*u-c.y,d2=dx*dx+dy*dy;
  if(d2<c.r*c.r&&d2>1e-8){const d=Math.sqrt(d2),p=c.r-d,nx=dx/d,ny=dy/d,w=(1-u)*(1-u)+u*u;
   a.x+=nx*p*(1-u)/w;a.y+=ny*p*(1-u)/w;e.x+=nx*p*u/w;e.y+=ny*p*u/w;
   if(1-u>.15)resp(a,nx,ny);if(u>.15)resp(e,nx,ny)}}}}
function drive(){const th=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0),br=K[' ']?1:0;
 for(const w of WH){if(w.arm.dead&&w.st.dead)continue;let s=0;const h=w.h;
  for(const n of w.R){const rx=n.x-h.x,ry=n.y-h.y,l=Math.hypot(rx,ry)||1,tx=-ry/l,ty=rx/l,vr=(n.vx-h.vx)*tx+(n.vy-h.vy)*ty;s+=vr;
   const F=th*328*Math.max(0,1-th*w.om/(th>0?150:45))-br*850*Math.max(-1,Math.min(1,vr/.5));n.fx+=F*tx;n.fy+=F*ty}
  w.om=s/12/.33}}
function step(){
 t+=DT;ub(t);
 for(const b of Bm){if(b.dead)continue;const a=b.a,e=b.b;let dx=e.x-a.x,dy=e.y-a.y;const len=Math.hypot(dx,dy);if(len<1e-6)continue;
  if(len>b.mx){b.dead=1;dirty=1;if(b.t===0)bk++;continue}
  dx/=len;dy/=len;let d=len-b.L;
  if(b.y){const s=d/b.L;if(s>b.y){b.L=len/(1+b.y);d=len-b.L}else if(s<-b.y){b.L=Math.max(.05,len/(1-b.y));d=len-b.L}}
  const f=b.k*d+b.q*d*d*d+b.c*((e.vx-a.vx)*dx+(e.vy-a.vy)*dy);
  a.fx+=f*dx;a.fy+=f*dy;e.fx-=f*dx;e.fy-=f*dy}
 drive();
 for(const n of N){
  n.vx+=n.fx/n.m*DT;n.vy+=(n.fy/n.m+G)*DT;n.fx=n.fy=0;
  const sp=Math.hypot(n.vx,n.vy),dr=(.01+.0015*sp)*DT;n.vx-=n.vx*dr;n.vy-=n.vy*dr;
  const wet=n.x>WX0&&n.x<WX1&&n.y>WY;
  if(wet){const s=Math.min(1,(n.y-WY)/.35),q=(2+.5*sp)*s*DT;n.vy-=G*n.bu*s*DT;n.vx-=n.vx*q;n.vy-=n.vy*q;if(!n.tire)n.bu=Math.max(.25,n.bu-.025*DT)}
  if(wet!==n.w){if(sp>2.5&&PA.length<300&&Math.random()<.4)for(let i=0;i<3;i++)PA.push({x:n.x,y:WY,vx:(Math.random()-.5)*4+n.vx*.15,vy:-Math.random()*Math.abs(n.vy)*.5-1,l:1});n.w=wet}
  if(sp>120){n.vx*=120/sp;n.vy*=120/sp}
  n.x+=n.vx*DT;n.y+=n.vy*DT}
 for(const n of N)col(n);skin()}
/* ---- rendering ---- */
const OUT=[0,1,2,3,4,5,6,13,12,16,15,14,8,7];
function draw(){
 cx.setTransform(D,0,0,D,0,0);
 const sk=cx.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#8fb8d4');sk.addColorStop(1,'#ece3cf');cx.fillStyle=sk;cx.fillRect(0,0,W,H);
 cx.setTransform(D*S,0,0,D*S,D*(W/2-cam.x*S),D*(H*.6-cam.y*S));
 const xl=cam.x-W/2/S-2,xr=cam.x+W/2/S+2,yb=cam.y+H/S;
 cx.beginPath();cx.moveTo(xl,yb);for(let x=Math.floor(xl);x<=xr+1;x++)cx.lineTo(x,gy(x));cx.lineTo(xr+1,yb);cx.closePath();
 cx.fillStyle='#51473f';cx.fill();cx.lineWidth=.3;cx.lineJoin='round';cx.strokeStyle='#8e8070';cx.stroke();
 for(let x=Math.ceil(xl/10)*10;x<xr;x+=10){cx.fillStyle=x%100?'#ffffff40':'#ffd86bcc';cx.fillRect(x-.06,gy(x)+.25,.12,x%100?.7:1.8)}
 for(const c of CY){cx.beginPath();cx.arc(c.x,c.y,c.r,0,7);cx.fillStyle='#7d868e';cx.fill();cx.lineWidth=.12;cx.strokeStyle='#3b4249';cx.stroke();cx.beginPath();cx.arc(c.x,c.y,c.r*.62,0,7);cx.stroke()}
 for(const b of BX){cx.fillStyle='#b8432b';cx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);cx.strokeStyle='#ffd23f';cx.lineWidth=.12;cx.setLineDash([.5,.5]);cx.strokeRect(b.x0+.1,b.y0+.1,b.x1-b.x0-.2,b.y1-b.y0-.2);cx.setLineDash([]);
  if(b.ram){cx.fillStyle='#4a5159';cx.fillRect((b.x0+b.x1)/2-.4,b.y0-90,.8,90)}}
 cx.beginPath();OUT.forEach((i,j)=>{const n=FN[i];j?cx.lineTo(n.x,n.y):cx.moveTo(n.x,n.y)});cx.closePath();cx.fillStyle='#262b33';cx.fill();
 for(const p of PT){
  if(p.w){cx.beginPath();for(let i=1;i<13;i++){const n=p.nodes[i];i>1?cx.lineTo(n.x,n.y):cx.moveTo(n.x,n.y)}cx.closePath();cx.fillStyle='#14161a';cx.fill();cx.lineWidth=.05;cx.strokeStyle='#000';cx.stroke();
   const h=p.nodes[0];cx.beginPath();cx.arc(h.x,h.y,.19,0,7);cx.fillStyle='#b4bcc3';cx.fill();
   for(const i of[1,4,7,10]){const n=p.nodes[i];cx.beginPath();cx.moveTo(h.x,h.y);cx.lineTo(h.x+(n.x-h.x)*.6,h.y+(n.y-h.y)*.6);cx.lineWidth=.05;cx.strokeStyle='#6b737a';cx.stroke()}}
  else{cx.beginPath();cx.moveTo(p.a.x,p.a.y);cx.lineTo(p.b.x,p.b.y);cx.lineWidth=p.th;cx.lineCap=p.th>.15?'butt':'round';cx.strokeStyle=C[p.c];cx.stroke()}}
 if(vb){cx.lineWidth=.025;cx.lineCap='butt';for(const b of Bm){if(b.dead)continue;const e=Math.min(1,Math.abs(Math.hypot(b.b.x-b.a.x,b.b.y-b.a.y)-b.L)/b.L/(b.y||.04));cx.strokeStyle='hsl('+(190-190*e)+',90%,55%)';cx.beginPath();cx.moveTo(b.a.x,b.a.y);cx.lineTo(b.b.x,b.b.y);cx.stroke()}}
 for(const p of PA){cx.fillStyle='rgba(235,248,255,'+p.l+')';cx.beginPath();cx.arc(p.x,p.y,.07,0,7);cx.fill()}
 const a=Math.max(WX0,xl),b=Math.min(WX1,xr);
 if(a<b){cx.beginPath();cx.moveTo(a,WY);for(let x=a;x<=b;x+=2)cx.lineTo(x,WY+.07*Math.sin(x*1.3+t*2));cx.lineTo(b,WY);for(let x=b;x>=a;x-=1)cx.lineTo(x,Math.max(gy(x),WY));cx.closePath();
  cx.fillStyle='rgba(35,120,170,.55)';cx.fill();cx.lineWidth=.06;cx.strokeStyle='rgba(200,235,255,.8)';cx.stroke()}}
/* ---- loop, input, HUD ---- */
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;let k=0;
 while(acc>=DT&&k++<110){step();acc-=DT}if(acc>DT)acc=0;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingleton's Page</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050711;
      --text: #f3f5ff;
      --muted: #9ca8c9;
      --accent: #a9c9ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: radial-gradient(ellipse at 50% 110%, #17264d 0%, #0a1025 38%, #050711 75%);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    #space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .nebula {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(62, 77, 157, .18), transparent 35%),
        radial-gradient(ellipse at 78% 65%, rgba(74, 105, 181, .12), transparent 32%),
        radial-gradient(ellipse at 50% 100%, rgba(91, 56, 145, .10), transparent 30%);
      filter: blur(20px);
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 22px;
    }
    .content {
      width: min(760px, 100%);
      text-align: center;
      padding: clamp(28px, 6vw, 62px) clamp(20px, 5vw, 54px);
      border: 1px solid rgba(173, 198, 255, .17);
      background: linear-gradient(145deg, rgba(16, 22, 44, .76), rgba(7, 10, 24, .58));
      border-radius: 24px;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(14px);
    }
    .eyebrow {
      color: #9baedb;
      font-size: .72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.05;
      font-size: clamp(2.7rem, 8vw, 5.8rem);
      text-shadow: 0 0 34px rgba(145, 177, 255, .16);
    }
    .subtitle {
      color: var(--muted);
      margin: 20px auto 34px;
      line-height: 1.7;
      max-width: 430px;
      font-size: .98rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    button, .project-link {
      appearance: none;
      border: 1px solid rgba(180, 203, 255, .28);
      border-radius: 12px;
      padding: 14px 22px;
      min-height: 49px;
      font: inherit;
      font-size: .92rem;
      color: var(--text);
      background: rgba(150, 179, 255, .08);
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    button:hover, .project-link:hover {
      transform: translateY(-2px);
      background: rgba(150, 179, 255, .16);
      border-color: rgba(190, 211, 255, .62);
    }
    button.primary {
      color: #080d1c;
      background: #d6e3ff;
      border-color: #d6e3ff;
      font-weight: 650;
    }
    button.primary:hover { background: #edf2ff; }
    .projects {
      display: none;
      margin: 28px auto 0;
      max-width: 420px;
      text-align: left;
      animation: rise .25s ease both;
    }
    .projects.open { display: block; }
    .projects h2 {
      color: #aebfe5;
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .project-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      background: rgba(5, 9, 23, .48);
    }
    .project-link span:last-child { color: #91a6d7; font-size: 1.2rem; }
    .footer {
      margin-top: 34px;
      color: #667396;
      font-size: .72rem;
      letter-spacing: .12em;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .content { border-radius: 18px; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="space" aria-hidden="true"></canvas>
  <main>
    <section class="content">
      <div class="eyebrow">personal space · web projects</div>
      <h1>Bingleton's page</h1>
      <p class="subtitle">not so personal site.</p>
      <div class="actions">
        <button class="primary" type="button" onclick="location.href='g.html'">open velora <span aria-hidden="true">↗</span></button>
        <button type="button" id="projectsToggle" aria-expanded="false" aria-controls="projects">web projects <span aria-hidden="true">＋</span></button>
      </div>
      <div class="projects" id="projects">
        <h2>web projects</h2>
        <a class="project-link" href="beamgpt/index.html">
          <span>beamgpt.drive</span><span aria-hidden="true">↗</span>
        </a>
                <a class="project-link" href="brush.html">
          <span>Board Rush</span><span aria-hidden="true">↗</span>
        </a>
      </div>
      <div class="footer">hi</div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let width = 0, height = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.floor(width * height / 4500) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.25 + .25,
        a: Math.random() * .65 + .2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * .7 + .2
      }));
      draw();
    }
    function draw() {
      ctx.clearRect(0, 0, width, height);
      const t = performance.now() / 1000;
      for (const s of stars) {
        const alpha = s.a * (.72 + Math.sin(t * s.speed + s.phase) * .28);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,232,255,${alpha})`;
        ctx.fill();
      }
      // A few faint constellation lines, kept away from the center.
      const groups = [
        [[.08,.18],[.13,.23],[.19,.20],[.23,.28],[.29,.25]],
        [[.73,.18],[.78,.13],[.84,.17],[.88,.25],[.94,.22]],
        [[.08,.76],[.13,.70],[.18,.75],[.22,.83],[.29,.80]],
        [[.72,.76],[.78,.72],[.83,.78],[.89,.73],[.94,.81]]
      ];
      for (const group of groups) {
        ctx.beginPath();
        group.forEach((p, i) => {
          const x = p[0] * width, y = p[1] * height;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = 'rgba(137,166,231,.22)';
        ctx.lineWidth = 1;
        ctx.stroke();
        for (const p of group) {
          ctx.beginPath();
          ctx.arc(p[0] * width, p[1] * height, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(190,211,255,.65)';
          ctx.fill();
        }
      }
      requestAnimationFrame(draw);
    }
    const toggle = document.getElementById('projectsToggle');
    const projects = document.getElementById('projects');
    toggle.addEventListener('click', () => {
      const isOpen = projects.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.innerHTML = `web projects <span aria-hidden="true">${isOpen ? '−' : '＋'}</span>`;
    });
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>

function readCookieSave(){try{const part=document.cookie.split('; ').find(x=>x.startsWith(SAVE_COOKIE+'='));return part?JSON.parse(decodeURIComponent(part.slice(SAVE_COOKIE.length+1))):null}catch(e){return null}}
function loadCollection(){
 const candidates=[];
 try{const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(v)candidates.push(v)}catch(e){}
 try{const v=JSON.parse(localStorage.getItem(SAVE_KEY+'_backup')||'null');if(v)candidates.push(v)}catch(e){}
 const cookieSave=readCookieSave();if(cookieSave)candidates.push(cookieSave);
 const v=candidates.sort((a,b)=>(Number(b.savedAt)||0)-(Number(a.savedAt)||0))[0]||{};
 wallet=Math.max(0,Math.floor(Number(v.wallet)||0));
 if(Array.isArray(v.owned))v.owned.forEach(x=>owned.add(x));
 if(v.equipped)for(let i=0;i<3;i++)if(owned.has(v.equipped[i]))equipped[i]=v.equipped[i];
}
function saveCollection(){
 const payload=JSON.stringify({wallet,owned:[...owned],equipped,savedAt:Date.now()});
 try{localStorage.setItem(SAVE_KEY,payload);localStorage.setItem(SAVE_KEY+'_backup',payload)}catch(e){}
 // Cookie backup covers browsers that restrict file:// localStorage.
 try{document.cookie=SAVE_COOKIE+'='+encodeURIComponent(payload)+'; max-age=31536000; path=/; SameSite=Lax'}catch(e){}
}

const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let LK=[];const rawG=x=>760+190*Math.sin(x/900)+85*Math.sin(x/370+1);
const G=x=>{for(const l of LK)if(x>l.a-200&&x<l.b+200){const u=Math.min(1,Math.min(x-l.a+200,l.b+200-x)/200),k=u*u*(3-2*u);return rawG(x)*(1-k)+l.y*k}return rawG(x)};
const inLake=x=>{for(const l of LK)if(x>l.a&&x<l.b)return l;return null};
const slopeAt=x=>(G(x+4)-G(x-4))/8;
function reset(seed){rng=mulberry(seed||(Math.random()*1e9|0));
 S={x:0,y:G(0),vx:T.HARE_CRUISE,vy:0,form:0,ground:true,flaps:T.FLAPS,inkX:-T.INK_START_LEAD,inv:0,stumbleT:0,coyote:0,buf:0,jcut:false,t:0,motes:0,score:0,flow:0,flowActive:false,flowTime:0,flowBonus:0,flowCooldown:0,
 ob:[],ch:[],up:[],mt:[],next:1500,dead:false,pop:0,txt:'',txtT:0,camY:G(0)-600,cam:0,flash:0,tr:[],inkBoost:0,fx:[],pg:true,pf:T.FLAPS,pform:0,lvy:0,lk:[],wet:false,flowFloorVx:0,craneTakeoffGrace:0};LK=S.lk;gen()}
function startRun(){reset();mode='play';try{ac=ac||new AudioContext()}catch(_){}}
function goHome(){saveCollection();mode='title';reset(33);S.vx=T.HARE_CRUISE;S.inkX=S.x-600;S.ground=true}
function say(s){S.txt=s;S.txtT=1.4;if(s==='SMASH'||s==='CRUSH')burst(S.x+30,S.y-40,FORM_COLS[2],2)}
function flowThreshold(form,zone){
 // Flow requires a higher sustained speed for every spirit.
 if(form===0)return Math.max(1050,cruiseFor(zone)*1.5); // Hare
 if(form===1)return 1050; // Crane
 return 850; // Tortoise
}
function tickFlow(dt){
 const zone=zoneAt(S.x/T.PX).n,threshold=flowThreshold(S.form,zone);
 if(S.flowActive){
  S.flowTime=Math.max(0,S.flowTime-dt);
  // Bonus score is added only while the overdrive is active.
  S.flowBonus+=Math.max(0,S.vx)*dt/T.PX;
  if(S.flowTime<=0){S.flowActive=false;S.flow=0;S.flowCooldown=4;S.flowFloorVx=0;S.txt='';S.txtT=0}
 }else if(S.flowCooldown>0){
  S.flowCooldown=Math.max(0,S.flowCooldown-dt);S.flow=0;
 }else{
  if(S.vx>=threshold)S.flow=Math.min(100,S.flow+(100/4.8)*dt);
  else S.flow=Math.max(0,S.flow-5*dt);
  if(S.flow>=100){
   S.flow=100;S.flowActive=true;S.flowTime=10; // Fixed 10-second Flow burst; speed changes cannot extend or shorten it.
   // A sharp overdrive surge, then a speed floor prevents water, drag or collisions from slowing any form.
   S.flowFloorVx=Math.min(T.MAX_SPEED,Math.max(S.vx+160,S.vx*1.18));
   S.vx=S.flowFloorVx;S.flash=.65;S.inkBoost=Math.max(S.inkBoost,.18);
   say('FLOW STATE');blip(1,1);
  }
 }
}
function zoneAt(dm){let d=dm,n=0;for(;;){const L=T.ZONE_LEN_M[n%5];if(d<L)return{i:n%5,n,start:dm-d};d-=L;n++}}
// ---- sim/gen.gd (simplified director) ----
function gen(){while(S.next<S.x+3600){let x=S.next;for(let k=0;k<30&&Math.abs(slopeAt(x))>.1;k++)x+=20;S.next=x;const z=zoneAt(x/T.PX),cr=cruiseFor(z.n),r=rng();let len=500;
 const pick=r<.2?'chasm':r<.38?'screen':r<.54?'bramble':r<.66?'hurdle':r<.8?'lake':(z.i>0&&r<.9?'gale':'motes');
 if(pick==='chasm'){const w=cr*(.34+rng()*.2);S.ch.push({a:x,b:x+w});len=w+380;
  for(let k=0;k<5;k++)S.mt.push({x:x+w*(k+.5)/5,off:150+120*Math.sin(Math.PI*k/4),got:0})}
 else if(pick==='lake'){const w=560+rng()*360;S.lk.push({a:x,b:x+w,y:rawG(x+w/2)});for(let k=0;k<6;k++)S.mt.push({x:x+w*(k+.5)/6,off:150+40*Math.sin(k),got:0});len=w+420}
 else if(pick==='gale'){const w=cr*.95;S.ch.push({a:x,b:x+w});S.up.push({a:x+w*.2,b:x+w*.6});len=w+380}
 else if(pick==='motes'){for(let k=0;k<8;k++)S.mt.push({x:x+k*50,off:110+60*Math.sin(k*.8),got:0});len=200}
 else{const n=z.i===3?2:1;for(let k=0;k<n;k++)S.ob.push({t:pick,x:x+k*330,dead:0});len=n*330+200}
 S.next+=len+420+rng()*420}}
const inCh=x=>{for(const c of S.ch)if(x>c.a&&x<c.b)return c;return null};
function stumble(){if(S.inv>0||S.dead||S.flowActive)return;S.vx=Math.max(T.STUMBLE_MIN,S.vx*T.STUMBLE_KEEP);S.inv=T.INVULN_T;S.stumbleT=T.STUMBLE_T;S.inkX+=150;S.inkBoost=Math.min(.28,S.inkBoost+.06);S.flash=1;say('STUMBLE');blip(0,-1)}
// ---- death ragdoll: Verlet paper-body with terrain and obstacle collisions ----
function makeRagdoll(recoilX=0){
 const form=S.form,scale=form===2?1.38:1,spin=(Math.random()<.5?-1:1)*(2.2+Math.random()*2.2);
 let spec,links;
 if(form===0){
  spec=[[0,0,18],[30,-20,12],[-20,5,11],[14,-3,8],[35,3,6],[48,12,5],[-35,13,7],[-47,25,5],[24,-45,4],[40,-42,4],[-43,-5,6]];
  links=[[0,1,12],[0,2,13],[0,3,10],[3,4,7],[4,5,6],[2,6,9],[6,7,6],[1,8,5],[1,9,4],[2,10,5]];
 }else if(form===1){
  spec=[[0,0,17],[35,-18,8],[55,-27,10],[-10,-20,7],[-60,-42,4],[15,-24,7],[70,-42,4],[-42,12,4],[-34,32,4],[-20,22,4],[-12,40,4]];
  links=[[0,1,8],[1,2,8],[0,3,7],[3,4,5],[0,5,7],[5,6,5],[0,7,5],[7,8,4],[0,9,5],[9,10,4]];
 }else{
  spec=[[0,0,25],[48,-12,12],[0,-22,25],[-28,5,10],[-40,22,7],[-46,27,5],[28,5,10],[40,22,7],[46,27,5],[-18,16,8],[-22,34,5],[20,16,8],[25,34,5],[-49,0,6]];
  links=[[0,1,12],[0,2,13],[0,3,10],[3,4,8],[4,5,6],[0,6,10],[6,7,8],[7,8,6],[0,9,8],[9,10,6],[0,11,8],[11,12,6],[3,13,5]];
 }
 const dt=T.DT,baseX=S.x,baseY=S.y-34*scale;
 const nodes=spec.map((v,i)=>{
  const x=baseX+v[0]*scale,y=baseY+v[1]*scale;
  const vx=S.vx*.43+recoilX-(v[1]*scale)*spin+(Math.random()-.5)*70;
  const vy=S.vy*.3+(v[0]*scale)*spin+80+(Math.random()-.5)*110;
  return{x,y,px:x-vx*dt,py:y-vy*dt,r:v[2]*scale};
 });
 const joints=links.map(([a,b,w])=>({a,b,len:Math.hypot(nodes[b].x-nodes[a].x,nodes[b].y-nodes[a].y),w:w*scale}));
 S.rag={form,scale,nodes,joints,time:0,frozen:false};
}
// Resolve penetration without turning the positional correction into extra velocity.
// In Verlet physics, failing to move the previous position by the same correction
// creates artificial energy, which is why wall contacts used to launch the ragdoll.
function ragResolve(p,nx,ny,depth,restitution=.05,tangentRetention=.94){
 const beforeVx=p.x-p.px,beforeVy=p.y-p.py;
 p.x+=nx*depth;p.y+=ny*depth;
 const vn=beforeVx*nx+beforeVy*ny;
 let vx=beforeVx,vy=beforeVy;
 if(vn<0){
  const tx=beforeVx-vn*nx,ty=beforeVy-vn*ny;
  vx=tx*tangentRetention-vn*restitution*nx;
  vy=ty*tangentRetention-vn*restitution*ny;
 }
 // Rebuild previous position from the corrected position and intended velocity.
 p.px=p.x-vx;p.py=p.y-vy;
}
function ragRect(p,left,top,right,bottom){
 const qx=Math.max(left,Math.min(right,p.x)),qy=Math.max(top,Math.min(bottom,p.y));
 const dx=p.x-qx,dy=p.y-qy,d=Math.hypot(dx,dy);
 if(d>=p.r)return;
 let nx,ny,depth;
 if(d>1e-5){nx=dx/d;ny=dy/d;depth=p.r-d;}
 else{
  const sides=[{v:p.x-left,nx:-1,ny:0},{v:right-p.x,nx:1,ny:0},{v:p.y-top,nx:0,ny:-1},{v:bottom-p.y,nx:0,ny:1}].sort((a,b)=>a.v-b.v);
  nx=sides[0].nx;ny=sides[0].ny;depth=p.r+sides[0].v;
 }
 ragResolve(p,nx,ny,depth,.045,.9);
}
// Tiki totems are floor-to-ceiling barriers. They have solid vertical sides
// and a top, but deliberately no collidable bottom face: that avoids trapping
// a foot/wing particle between the wall bottom and the terrain floor.
function ragWall(p,left,top,right,bottom){
 if(p.y+p.r<=top||p.y-p.r>=bottom||p.x+p.r<=left||p.x-p.r>=right)return;
 const vy=p.y-p.py;
 const crossedTop=p.py+p.r<=top+3&&p.y+p.r>top&&vy>0;
 if(crossedTop){ragResolve(p,0,-1,p.y+p.r-top,.035,.92);return;}
 const fromLeft=p.px+p.r<=left+2&&p.x+p.r>left;
 const fromRight=p.px-p.r>=right-2&&p.x-p.r<right;
 let nx,depth;
 if(fromLeft||(!fromRight&&p.x<=(left+right)*.5)){
  nx=-1;depth=p.x+p.r-left;
 }else{
  nx=1;depth=right-(p.x-p.r);
 }
 if(depth>0)ragResolve(p,nx,0,depth,.018,.985);
}
// Chasm walls are real collision surfaces for the ragdoll. A node that reaches
// either inner rock face is nudged back into the opening and gets a small,
// horizontal-only rebound. Vertical velocity is retained, so it keeps falling
// instead of being launched upward or pushed out onto the ledge.
function collideRagChasm(p){
 for(const c of S.ch){
  const leftFloor=G(c.a),rightFloor=G(c.b);
  if(p.y-p.r>Math.max(leftFloor,rightFloor)+1100)continue;
  // Each wall only becomes solid once the node has dropped below that ledge.
  // Left wall: bounce inward for nodes in the gap, outward for nodes on the ledge.
  if(p.y+p.r>leftFloor+4){
   if(p.x>=c.a && p.x-p.r<c.a){
    ragResolve(p,1,0,c.a-(p.x-p.r),.16,.995);
   }else if(p.x<c.a && p.x+p.r>c.a){
    ragResolve(p,-1,0,p.x+p.r-c.a,.16,.995);
   }
  }
  // Right wall mirrors the left wall.
  if(p.y+p.r>rightFloor+4){
   if(p.x<=c.b && p.x+p.r>c.b){
    ragResolve(p,-1,0,p.x+p.r-c.b,.16,.995);
   }else if(p.x>c.b && p.x-p.r<c.b){
    ragResolve(p,1,0,c.b-(p.x-p.r),.16,.995);
   }
  }
 }
}
function collideRagNode(p){
 // Resolve the hole walls before checking the ground. The gap itself has no floor.
 collideRagChasm(p);
 if(!inCh(p.x)){
  const gy=G(p.x);
  if(p.y+p.r>gy){const depth=p.y+p.r-gy;let nx=-slopeAt(p.x),ny=-1,n=Math.hypot(nx,ny)||1;ragResolve(p,nx/n,ny/n,depth,.055,.91);}
 }
 for(const o of S.ob){if(o.dead)continue;const d=OB[o.t];if(!d||Math.abs(p.x-o.x)>d.w/2+p.r+4)continue;
  const gy=G(o.x),left=o.x-d.w/2,right=o.x+d.w/2,bottom=gy+5,top=gy-d.h;
  // Every generated obstacle rests on the ground, so resolve its top and sides only.
  // A bottom face would pinch particles against the floor and create launch impulses.
  ragWall(p,left,top,right,bottom);
 }
 // Floor wins if any obstacle correction nudges a node below the terrain.
 if(!inCh(p.x)){const floor=G(p.x);if(p.y+p.r>floor){const depth=p.y+p.r-floor;const nx=-slopeAt(p.x),ny=-1,n=Math.hypot(nx,ny)||1;ragResolve(p,nx/n,ny/n,depth,.045,.9);}}
}
function updateRagdoll(dt){
 const rag=S.rag;if(!rag||rag.frozen)return;
 rag.time+=dt;S.t+=dt;
 const grav=2050,drag=.992;
 for(const p of rag.nodes){const vx=(p.x-p.px)*drag,vy=(p.y-p.py)*drag;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+grav*dt*dt;}
 for(let it=0;it<6;it++){
  for(const j of rag.joints){
   const a=rag.nodes[j.a],b=rag.nodes[j.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001;
   const diff=(d-j.len)/d*.72,cx=dx*diff*.5,cy=dy*diff*.5;
   // Constraint corrections also move previous positions so they do not
   // inject velocity into the next Verlet frame.
   a.x+=cx;a.y+=cy;a.px+=cx;a.py+=cy;
   b.x-=cx;b.y-=cy;b.px-=cx;b.py-=cy;
  }

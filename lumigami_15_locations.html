 s.inkBoost=Math.min(.28,s.inkBoost+(o.t==='bramble'?.05:.08));burst(o.x,og-60,[1,.96,.9],0,1)}
function birds(p,cx,t){g.fillStyle=rgb(p,O.L+9,1.05);for(let f=0;f<3;f++)for(let i=0;i<6;i++){const bx=((f*900+i*58+t*(26+f*8)-cx*(.05+f*.04))%(W+500)+W+500)%(W+500)-250,by=180+f*90+i*(i%2?14:-14)+Math.sin(t*.7+i+f)*10,fl=Math.sin(t*7+i*1.3+f)*10,sc=1.1-f*.2;g.beginPath();g.moveTo(bx-14*sc,by-fl*sc);g.lineTo(bx,by);g.lineTo(bx+14*sc,by-fl*sc);g.lineTo(bx,by+4*sc);g.closePath();g.fill()}}
function water(cx,cy,p){const s=S;for(const l of s.lk){if(l.b<cx-50||l.a>cx+W+50)continue;const a=Math.max(0,l.a-cx),b=Math.min(W,l.b-cx),top=l.y-34-cy;if(b<=a)continue;
 const sy=x=>{const e=Math.min(1,(x+cx-l.a)/70,(l.b-x-cx)/70);return top+34*(1-e)+3*e*Math.sin((x+cx)*.04+s.t*2.2)};
 const gr=g.createLinearGradient(0,top,0,top+120);gr.addColorStop(0,rgba(p,O.SL,.62));gr.addColorStop(1,rgba(p,O.L+12,.88));g.fillStyle=gr;g.beginPath();g.moveTo(a,top+300);for(let x=a;x<=b;x+=10)g.lineTo(x,sy(x));g.lineTo(b,sy(b));g.lineTo(b,top+300);g.fill();
 g.strokeStyle=rgba(p,O.RIM,.8);g.lineWidth=3;g.beginPath();for(let x=a;x<=b;x+=10)x===a?g.moveTo(x,sy(x)):g.lineTo(x,sy(x));g.stroke();
 g.globalCompositeOperation='lighter';g.fillStyle=rgba(p,O.RIM,.5);for(let i=0;i<26;i++){const sx=a+((i*97+s.t*14*(i%3+1))%(b-a+1));g.fillRect(sx,top+10+(i*37)%60,10+(i%3)*6,2)}g.globalCompositeOperation='source-over'}
 if(s.wet){const px=s.x-cx,sy2=G(s.x)-34-cy;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;for(let k=0;k<3;k++){const u=(s.t*1.4+k/3)%1;g.globalAlpha=1-u;g.beginPath();g.ellipse(px-u*30,sy2+3,24+u*60,5+u*8,0,0,7);g.stroke()}g.globalAlpha=1}}
function brickStep(b,dt){if(b.st)return;b.vy+=T.GRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;const c=inCh(b.x),gy=G(b.x)-b.h/2;
 if(!c&&b.y>=gy){b.y=gy;if(Math.abs(b.vy)>90){b.vy*=-.28;b.vx*=.7;b.vr*=.6}else{b.vy=0;b.vx*=.9;b.vr*=.8;b.r+=(Math.round(b.r/Math.PI)*Math.PI-b.r)*.12;if(Math.abs(b.vx)<8)b.st=1}}
 else if(c&&b.y>G(b.x)+900)b.st=1}

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Studio</title>
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#16202c;--mute:#6b7787;--line:#d5dce4;--acc:#2f6bff;--on:#fff;--stage:#dfe6ee;--hi:#e6eeff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1a2029;--ink:#e8edf3;--mute:#8e9aaa;--line:#2c3541;--acc:#6b95ff;--on:#0b1220;--stage:#0e1319;--hi:#25324a}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1a2029;--ink:#e8edf3;--mute:#8e9aaa;--line:#2c3541;--acc:#6b95ff;--on:#0b1220;--stage:#0e1319;--hi:#25324a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 10px 0 0;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}
button,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.on,button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.sp{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr)}
#stage{grid-column:1;grid-row:1/3}
main>aside{grid-column:2;border-right:0;border-left:1px solid var(--line)}
main>aside.r{grid-row:2;border-top:1px solid var(--line)}
main.closed{grid-template-columns:1fr}
main.closed>aside{display:none}
#pt{position:absolute;top:8px;right:8px;z-index:3;background:var(--panel)}
aside{background:var(--panel);overflow:auto;padding:10px;border-right:1px solid var(--line)}
aside.r{border-right:0;border-left:1px solid var(--line)}
h2{font-size:13px;margin:0 0 8px}
.mute{color:var(--mute);margin:4px 0}
#stage{position:relative;background:var(--stage);min-height:300px;overflow:hidden}
#cv,#v3{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#list{margin-bottom:12px}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer}
.row:hover{background:var(--bg)}.row.sel{background:var(--hi);outline:1px solid var(--acc)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.row i{color:var(--mute);font-size:12px;font-style:normal}
.row b{color:var(--mute);padding:0 4px}.row b:hover{color:#e5392b}
.add{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.add input[type=text]{width:100%}
input[type=text],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=color]{width:100%;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
label{display:block;font-size:12px;color:var(--mute)}label input,label select{color:var(--ink);margin-top:2px}
label.full{grid-column:1/-1}
.tools{position:absolute;top:8px;left:8px;z-index:2;display:none;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px)}
.tools button{padding:4px 9px;background:var(--panel)}
.tools button.on{background:var(--acc);color:var(--on)}
.ly{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.ly button{padding:4px 8px;font-size:12px}
.err{color:#e5392b;margin:2px 0}
label.fl{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:14px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:20;display:flex;gap:10px;align-items:center;max-width:92vw}
#toast[hidden]{display:none}
#toast button{padding:2px 8px}
#itx{height:34vh}
.tools .tcb{display:none}.tools.tc .tcb{display:inline-block}.tools.tc .ax{display:none}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(760px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;height:46vh;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media(max-width:900px){body{height:auto;min-height:100%}main,main.closed{grid-template-columns:1fr;grid-template-rows:auto}#stage{grid-row:auto;height:70vw;min-height:320px;order:-1}main>aside,main>aside.r{grid-column:1;grid-row:auto;border:0;border-top:1px solid var(--line)}}
</style></head>
<body>
<header>
 <h1>Model Studio</h1>
 <button id="m2" class="on">2D</button><button id="m3">3D</button>
 <select id="cat" aria-label="Category"><option value="car">Car</option><option value="spider">Spider</option><option value="human">Human</option><option value="animal">Animal</option><option value="robot">Robot</option><option value="custom">Custom</option></select>
 <button id="st">Load starter</button><button id="clr">Clear</button>
 <span class="sp"></span>
 <button id="an">Test animation</button><button id="im">Import</button><button id="ex" class="pri">Export code</button>
</header>
<main>
 <aside>
  <h2>Parts</h2><div id="list"></div><div class="g" style="grid-template-columns:repeat(3,1fr);margin:0 0 12px"><button id="bcopy">Copy</button><button id="bpaste">Paste</button><button id="bdup">Duplicate</button></div>
  <div class="add">
   <h2>Add a part</h2>
   <input type="text" id="pname" list="names" placeholder="Part name, e.g. wheelFL" aria-label="Part name">
   <datalist id="names"></datalist>
   <div class="g" style="margin:0"><select id="shape" aria-label="Shape"></select><input type="color" id="col" value="#e0552f" aria-label="Color"></div>
   <label><input type="checkbox" id="att" checked> Attach to selected part</label>
   <button id="add" class="pri">Add part</button>
   <button id="dr">Draw a shape by hand</button>
   <p class="mute" id="hint2"></p>
  </div>
 </aside>
 <div id="stage"><canvas id="cv"></canvas><div id="v3"></div><button id="pt">Hide panel</button><div class="tools" id="tools"><button data-t="move" class="on">Move (W)</button><button data-t="rotate">Rotate (E)</button><button data-t="scale">Scale (R)</button><button data-o="space" class="tcb" style="margin-left:8px">World</button><button data-o="snap" class="tcb">Snap off</button><button data-a="all" class="on ax" style="margin-left:8px">All axes</button><button data-a="x" class="ax">X</button><button data-a="y" class="ax">Y</button><button data-a="z" class="ax">Z</button></div></div>
 <aside class="r"><h2>Part editor</h2><div id="props"></div></aside>
</main>
<dialog id="dlg">
 <h2>Export code</h2>
 <p class="mute" id="eh"></p>
 <textarea id="code" readonly spellcheck="false"></textarea>
 <div class="bar"><button id="cp" class="pri">Copy code</button><button id="dh" hidden>Download demo page (.html)</button><button id="dt" hidden>Download code (.txt)</button><button id="cl">Close</button></div>
 <p class="mute" id="es"></p>
</dialog>
<dialog id="dlg2">
 <h2>Import a model</h2>
 <p class="mute">Paste code exported from Model Studio (or its JSON), or choose a file. Studio detects whether it is 2D or 3D and opens the matching editor. It replaces the model currently in that studio, and you can undo right after.</p>
 <textarea id="itx" spellcheck="false" placeholder="Paste exported code here"></textarea>
 <div class="bar"><button id="ig" class="pri">Import pasted code</button><label class="fl">Choose file<input type="file" id="if" accept=".js,.txt,.html,.json,.md" hidden></label><button id="ic">Close</button></div>
 <p class="mute err" id="ie"></p>
</dialog>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
const $=s=>document.querySelector(s),D=Math.PI/180;
const CATS={car:['body','cabin','wheelFL','wheelFR','wheelBL','wheelBR','hood','door'],spider:['torso','head','legL0','legL1','legL2','legL3','legR0','legR1','legR2','legR3','fang'],human:['torso','head','armL','armR','legL','legR','hand','foot'],animal:['body','head','tail','legFL','legFR','legBL','legBR','ear','wing'],robot:['body','head','armL','armR','legL','legR','antenna','eye'],custom:['part1','part2']};
const P=(name,shape,x,y,w,h,color,parent,ox,oy,rot,back)=>({name,shape,x,y,rot:rot||0,w,h,ox:ox||0,oy:oy||0,color,parent:parent||null,...(back?{back:1}:{})});
const Q=(name,shape,x,y,z,w,h,d,color,parent,ox,oy,oz,rx,ry,rz)=>({name,shape,x,y,z,rx:rx||0,ry:ry||0,rz:rz||0,w,h,d,ox:ox||0,oy:oy||0,oz:oz||0,color,parent:parent||null});

function tpl(cat,mode){
 const a=[],is2=mode==='2d';
 if(cat==='car'){
  if(is2){a.push(P('body','rect',0,0,200,50,'#d63c2f'),P('cabin','rect',-5,-38,110,34,'#b02d22','body'),P('window','rect',0,0,84,22,'#9fd3ee','cabin'));
   [['F',65],['B',-65]].forEach(([k,x])=>a.push(P('wheel'+k,'circle',x,26,46,46,'#222','body'),P('rim'+k,'rect',0,0,8,34,'#999','wheel'+k)));}
  else{a.push(Q('body','box',0,.55,0,2.2,.5,1.1,'#d63c2f'),Q('cabin','box',-.1,.42,0,1.1,.4,.9,'#b02d22','body'));
   [['FL',.7,.6],['FR',.7,-.6],['BL',-.7,.6],['BR',-.7,-.6]].forEach(([k,x,z])=>a.push(Q('wheel'+k,'cylinder',x,-.25,z,.55,.2,.55,'#222','body',0,0,0,90),Q('hub'+k,'box',0,0,0,.4,.24,.07,'#aaa','wheel'+k)));}
 }else if(cat==='spider'){
  if(is2){a.push(P('torso','circle',0,0,60,90,'#2b2b2b'),P('head','circle',0,-56,36,34,'#1c1c1c','torso'));
   [-1,1].forEach(s=>[0,1,2,3].forEach(i=>a.push(P((s<0?'legL':'legR')+i,'rect',s*22,-28+i*19,64,7,'#111','torso',s*32,0,s*(i-1.5)*16,true))));}
  else{a.push(Q('torso','sphere',0,.6,0,1,.6,1.3,'#2b2b2b'),Q('head','sphere',0,.05,-.85,.6,.5,.5,'#1c1c1c','torso'));
   [-1,1].forEach(s=>[0,1,2,3].forEach(i=>a.push(Q((s<0?'legL':'legR')+i,'box',s*.35,-.1,-.4+i*.27,.9,.07,.07,'#111','torso',s*.45,0,0,0,-s*(i-1.5)*20,-s*25))));}
 }else if(cat==='human'){
  if(is2){a.push(P('torso','rect',0,0,40,70,'#3a6fd8'),P('head','circle',0,-50,34,34,'#f0c29a','torso'),
   P('armL','rect',-26,-30,12,50,'#f0c29a','torso',0,22,0,true),P('armR','rect',26,-30,12,50,'#f0c29a','torso',0,22,0,true),
   P('legL','rect',-10,35,14,60,'#2b3a55','torso',0,28),P('legR','rect',10,35,14,60,'#2b3a55','torso',0,28));}
  else{a.push(Q('torso','box',0,1.2,0,.6,.9,.3,'#3a6fd8'),Q('head','sphere',0,.7,0,.4,.4,.4,'#f0c29a','torso'),
   Q('armL','box',-.4,.35,0,.18,.7,.18,'#f0c29a','torso',0,-.3,0),Q('armR','box',.4,.35,0,.18,.7,.18,'#f0c29a','torso',0,-.3,0),
   Q('legL','box',-.15,-.45,0,.2,.8,.2,'#2b3a55','torso',0,-.4,0),Q('legR','box',.15,-.45,0,.2,.8,.2,'#2b3a55','torso',0,-.4,0));}
 }else CATS[cat].forEach((n,i)=>{const c='hsl('+(i*47%360)+',55%,55%)';a.push(is2?P(n,'rect',(i%4-1.5)*70,(i/4|0)*60-60,50,40,c):Q(n,'box',(i%4-1.5)*.8,(i/4|0)*.8,0,.5,.5,.5,c))});
 if(is2)layerize(a);
 return a;
}
function layerize(a){a.forEach((p,i)=>{if(p.z===undefined)p.z=i});a.forEach(p=>{if(p.back){const q=a.find(r=>r.name===p.parent);p.z=(q?q.z:0)-.5}delete p.back});[...a].sort((x,y)=>x.z-y.z).forEach((p,i)=>p.z=i)}

/* ---- Runtime functions: these exact functions are written into the export ---- */
function drawModel2D(ctx,model,x,y,s,pose){
 pose=pose||{};s=s||1;
 const by={},M={};model.parts.forEach(p=>by[p.name]=p);
 const mat=p=>{
  if(M[p.name])return M[p.name];
  const q=p.parent&&by[p.parent]?mat(by[p.parent]):[1,0,0,1,0,0],r=(p.rot+(pose[p.name]||0))*Math.PI/180,c=Math.cos(r),n=Math.sin(r);
  return M[p.name]=[q[0]*c+q[2]*n,q[1]*c+q[3]*n,-q[0]*n+q[2]*c,-q[1]*n+q[3]*c,q[0]*p.x+q[2]*p.y+q[4],q[1]*p.x+q[3]*p.y+q[5]];
 };
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 model.parts.map((p,i)=>[p,i]).sort((a,b)=>(a[0].z||0)-(b[0].z||0)||a[1]-b[1]).forEach(([p])=>{
  ctx.save();ctx.transform(...mat(p));ctx.translate(p.ox,p.oy);ctx.fillStyle=p.color;ctx.beginPath();
  if(p.shape==='rect')ctx.rect(-p.w/2,-p.h/2,p.w,p.h);
  else if(p.shape==='circle')ctx.ellipse(0,0,p.w/2,p.h/2,0,0,7);
  else if(p.shape==='triangle'){ctx.moveTo(0,-p.h/2);ctx.lineTo(p.w/2,p.h/2);ctx.lineTo(-p.w/2,p.h/2);ctx.closePath()}
  else{p.pts.forEach((a,i)=>i?ctx.lineTo(a[0]*p.w,a[1]*p.h):ctx.moveTo(a[0]*p.w,a[1]*p.h));ctx.closePath()}
  ctx.fill();ctx.restore();
 });
 ctx.restore();
}
function buildModel3D(THREE,model){
 const root=new THREE.Group(),r=Math.PI/180;root.parts={};
 model.parts.forEach(p=>{
  const g=new THREE.Group();g.name=p.name;g.position.set(p.x,p.y,p.z);
  g.rotation.order='ZYX';g.rotation.set(p.rx*r,p.ry*r,p.rz*r);
  const geo=p.shape==='sphere'?new THREE.SphereGeometry(.5,24,16):p.shape==='cylinder'?new THREE.CylinderGeometry(.5,.5,1,24):p.shape==='cone'?new THREE.ConeGeometry(.5,1,24):new THREE.BoxGeometry(1,1,1);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:p.color}));
  m.scale.set(p.w,p.h,p.d);m.position.set(p.ox,p.oy,p.oz);g.add(m);root.parts[p.name]=g;
 });
 model.parts.forEach(p=>(p.parent?root.parts[p.parent]:root).add(root.parts[p.name]));
 return root;
}

/* ---- State ---- */
let S={mode:'2d',cat:'car',m:{'2d':null,'3d':null},sel:{'2d':null,'3d':null},anim:false,draw:false};
try{const s=JSON.parse(localStorage.getItem('mstudio4')||'null');if(s&&s.m&&s.m['2d']&&s.m['3d'])S=Object.assign(S,s,{anim:false,draw:false})}catch(e){}
if(!S.m['2d'])S.m={'2d':{parts:tpl(S.cat,'2d')},'3d':{parts:tpl(S.cat,'3d')}};
S.m['2d'].parts.forEach(p=>{if(p.shape==='path'&&!p.w){const xs=p.pts.map(a=>a[0]),ys=p.pts.map(a=>a[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),bw=Math.max(x1-x0,4),bh=Math.max(y1-y0,4),mx=(x0+x1)/2,my=(y0+y1)/2;p.pts=p.pts.map(a=>[(a[0]-mx)/bw,(a[1]-my)/bh]);p.w=bw;p.h=bh;p.ox=Math.round(mx);p.oy=Math.round(my)}});
layerize(S.m['2d'].parts);
const cur=()=>S.m[S.mode],sel=()=>cur().parts.find(p=>p.name===S.sel[S.mode]);
const desc=(m,n)=>m.parts.filter(p=>p.parent===n).flatMap(p=>[p.name,...desc(m,p.name)]);
let dirty3=true;
const save=()=>{try{localStorage.setItem('mstudio4',JSON.stringify(S))}catch(e){}};
const changed=()=>{save();dirty3=true};

/* ---- UI ---- */
function renderList(){
 const m=cur(),out=[];
 const walk=(par,d)=>m.parts.filter(p=>p.parent===par).forEach(p=>{
  out.push(`<div class="row${p.name===S.sel[S.mode]?' sel':''}" data-n="${esc(p.name)}" style="padding-left:${d*14+6}px"><span class="nm">${esc(p.name)}</span><i>${S.mode==='2d'?'L'+rk(p)+' ':''}${p.shape}</i><b data-del="${esc(p.name)}" title="Delete part">✕</b></div>`);walk(p.name,d+1)});
 walk(null,0);
 $('#list').innerHTML=out.join('')||'<p class="mute">No parts yet. Add one below or load a starter.</p>';
}
const F2=['x','y','rot','w','h','ox','oy'],F3=['x','y','z','rx','ry','rz','w','h','d','ox','oy','oz'];
function renderProps(){
 const el=$('#props'),p=sel(),m=cur();
 if(!p){el.innerHTML='<p class="mute">Select a part in the list'+(S.mode==='2d'?' or click it on the canvas':'')+' to edit it.</p>';return}
 const bad=[p.name,...desc(m,p.name)],shapes=S.mode==='2d'?['rect','circle','triangle','path']:['box','sphere','cylinder','cone'];
 const st=S.mode==='2d'?1:.05;
 el.innerHTML=`<label>Name<input type="text" data-k="name" value="${esc(p.name)}"></label><p class="mute err" id="nmsg"></p>
 <div class="g"><label>Parent<select data-k="parent"><option value="">none</option>${m.parts.filter(q=>!bad.includes(q.name)).map(q=>`<option value="${esc(q.name)}"${q.name===p.parent?' selected':''}>${esc(q.name)}</option>`).join('')}</select></label>
 <label>Shape<select data-k="shape"${p.shape==='path'?' disabled':''}>${shapes.map(s=>`<option${s===p.shape?' selected':''}>${s}</option>`).join('')}</select></label></div>
 <label>Color<input type="color" data-k="color" value="${p.color}"></label>
 <div class="g">${(S.mode==='2d'?F2:F3).map(k=>`<label>${k}<input type="number" step="${k[0]==='r'?5:st}" data-k="${k}" value="${p[k]}"></label>`).join('')}</div>
 ${S.mode==='2d'?`<label>Layer ${rk(p)} of ${m.parts.length} (higher draws on top)</label><div class="ly"><button data-ly="front">To front</button><button data-ly="up">Forward</button><button data-ly="down">Backward</button><button data-ly="back">To back</button></div>`:''}
 <p class="mute">x, y${S.mode==='3d'?', z':''} = where this part pivots on its parent. ox, oy${S.mode==='3d'?', oz':''} = how far the shape sits from its pivot, so a leg can swing from its top.</p>`;
}
$('#props').oninput=e=>{
 const t=e.target,k=t.dataset.k,p=sel();if(!k||!p)return;
 if(k==='name'){const v=t.value.trim(),bad=!v||cur().parts.some(q=>q!==p&&q.name===v);$('#nmsg').textContent=bad?(v?'That name is already used.':'Give the part a name.'):'';if(bad)return;
  cur().parts.forEach(q=>{if(q.parent===p.name)q.parent=v});p.name=v;S.sel[S.mode]=v;renderList()}
 else if(k==='parent'){p.parent=t.value||null;renderList()}
 else if(k==='shape'){p.shape=t.value;renderList()}
 else if(k==='color')p.color=t.value;
 else p[k]=parseFloat(t.value)||0;
 changed();
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const rk=p=>[...cur().parts].sort((a,b)=>a.z-b.z).indexOf(p)+1;
function syncIn(p){document.querySelectorAll('#props input[type=number]').forEach(i=>{if(i.dataset.k in p)i.value=p[i.dataset.k]})}
function hdl(p,m){const hw=p.w/2,hh=p.h/2,a=[];[-1,0,1].forEach(sy=>[-1,0,1].forEach(sx=>{if(sx||sy)a.push({sx,sy,l:[p.ox+sx*hw,p.oy+sy*hh]})}));a.push({rot:1,l:[p.ox,p.oy-hh-28]});a.forEach(h=>{const q=m.transformPoint(new DOMPoint(h.l[0],h.l[1]));h.x=q.x;h.y=q.y});return a}
$('#props').onclick=e=>{
 const a=e.target.dataset.ly,p=sel();if(!a||!p)return;
 const l=[...cur().parts].sort((x,y)=>x.z-y.z);l.forEach((q,j)=>q.z=j);const i=l.indexOf(p);
 if(a==='front')p.z=1e9;else if(a==='back')p.z=-1e9;else{const o=l[i+(a==='up'?1:-1)];if(o)[p.z,o.z]=[o.z,p.z]}
 [...cur().parts].sort((x,y)=>x.z-y.z).forEach((q,j)=>q.z=j);changed();renderList();renderProps();
};

     if(!q.w){const xs=q.pts.map(a=>a[0]),ys=q.pts.map(a=>a[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),bw=Math.max(x1-x0,4),bh=Math.max(y1-y0,4),mx=(x0+x1)/2,my=(y0+y1)/2;q.pts=q.pts.map(a=>[(a[0]-mx)/bw,(a[1]-my)/bh]);q.w=bw;q.h=bh;q.ox=Math.round(mx);q.oy=Math.round(my)}}
    else q.shape='rect'}
   if(typeof p.z==='number')q.z=p.z;if(p.back)q.back=1}
  else Object.assign(q,{z:num(p.z,0),rx:num(p.rx,0),ry:num(p.ry,0),rz:num(p.rz,0),w:num(p.w,.6),h:num(p.h,.6),d:num(p.d,.6),ox:num(p.ox,0),oy:num(p.oy,0),oz:num(p.oz,0)});
  q.color=col(p.color);q.parent=p.parent!=null&&map[p.parent]!==undefined&&map[p.parent]!==q.name?map[p.parent]:null;
  return q;
 });
 out.forEach(p=>{let q=p,c=0;while(q&&q.parent&&c<=out.length){q=out.find(r=>r.name===q.parent);c++}if(c>out.length)p.parent=null});
 if(is2)layerize(out);
 return out;
}
let tt;
function toast(msg,undo){
 const t=$('#toast');t.innerHTML='';const s=document.createElement('span');s.textContent=msg;t.append(s);
 if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();t.hidden=true};t.append(b)}
 t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,9000);
}
function importText(text){
 text=String(text||'').trim();if(!text)return 'Nothing to import yet. Paste code or choose a file.';
 let data=null;try{data=JSON.parse(text)}catch(e){try{data=extractModel(text)}catch(e2){data=null}}
 const raw=Array.isArray(data)?data:data&&Array.isArray(data.parts)?data.parts:null;
 if(!raw||!raw.length)return 'Could not find a model in that text. Use code exported from Model Studio.';
 const mode=detectMode(raw,text),parts=normParts(raw,mode);
 if(!parts.length)return 'That model has no parts.';
 const u={target:mode,prevMode:S.mode,cat:S.cat,m:JSON.stringify(S.m[mode]),sel:S.sel[mode]};
 S.m[mode]={parts};S.sel[mode]=null;
 const c=/Model Studio export \((?:2D|3D), (\w+)\)/.exec(text);if(c&&CATS[c[1]]){S.cat=c[1];$('#cat').value=c[1];setNames()}
 changed();setMode(mode);
 toast('Opened a '+mode.toUpperCase()+' model ('+parts.length+' parts) in the '+mode.toUpperCase()+' studio.',()=>{S.m[u.target]=JSON.parse(u.m);S.sel[u.target]=u.sel;S.cat=u.cat;$('#cat').value=u.cat;setNames();changed();setMode(u.prevMode)});
 return '';
}
$('#im').onclick=()=>{$('#ie').textContent='';$('#dlg2').showModal()};
$('#ic').onclick=()=>$('#dlg2').close();
$('#ig').onclick=()=>{const m=importText($('#itx').value);$('#ie').textContent=m;if(!m){$('#itx').value='';$('#dlg2').close()}};
const readFile=f=>f.text().then(t=>{const m=importText(t);if($('#dlg2').open){$('#ie').textContent=m;if(!m)$('#dlg2').close()}else if(m)toast(m)});
$('#if').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)readFile(f)});
$('#pt').onclick=()=>{const c=$('main').classList.toggle('closed');$('#pt').textContent=c?'Show panel':'Hide panel'};
/* ---- Copy, paste, shortcuts ---- */
let clip=null;
function copySel(quiet){
 const p=sel();if(!p){toast('Select a part first.');return false}
 const m=cur(),ns=[p.name,...desc(m,p.name)];
 clip={mode:S.mode,root:p.name,parts:JSON.parse(JSON.stringify(m.parts.filter(q=>ns.includes(q.name))))};
 if(!quiet)toast('Copied '+ns.length+(ns.length>1?' parts (with children)':' part')+'. Paste with Ctrl+V.');
 return true;
}
function pasteClip(){
 if(!clip||clip.mode!==S.mode){toast('Copy a part in the '+S.mode.toUpperCase()+' studio first.');return}
 const m=cur(),map={},is2=S.mode==='2d',zb=is2?Math.max(-1,...m.parts.map(q=>q.z))+1:0,zmin=is2?Math.min(...clip.parts.map(q=>q.z)):0,taken=new Set(m.parts.map(q=>q.name));
 clip.parts.forEach(q=>{const b=q.name.replace(/ copy( \d+)?$/,'')+' copy';let n=b,i=2;while(taken.has(n))n=b+' '+i++;taken.add(n);map[q.name]=n});
 const rp=clip.parts.find(q=>q.name===clip.root).parent;
 const add=clip.parts.map(q=>{
  const c=JSON.parse(JSON.stringify(q));c.name=map[q.name];
  if(q.name===clip.root){c.parent=rp&&m.parts.some(r=>r.name===rp)?rp:null;c.x+=is2?24:.3}else c.parent=map[q.parent];
  if(is2)c.z=zb+q.z-zmin;
  return c;
 });
 m.parts.push(...add);S.sel[S.mode]=map[clip.root];changed();renderList();renderProps();
}
function setTool(t){tool=t;document.querySelectorAll('#tools [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t))}
$('#bcopy').onclick=()=>copySel();$('#bpaste').onclick=pasteClip;$('#bdup').onclick=()=>{if(copySel(true))pasteClip()};
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input,textarea,select,dialog'))return;
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(mod&&k==='c'){copySel();e.preventDefault()}
 else if(mod&&k==='v'){pasteClip();e.preventDefault()}
 else if(mod&&k==='d'){if(copySel(true))pasteClip();e.preventDefault()}
 else if(k==='delete'||k==='backspace'){const p=sel();if(p){del(p.name);e.preventDefault()}}
 else if(k==='escape'){S.sel[S.mode]=null;renderList();renderProps()}
 else if(!mod&&S.mode==='3d'&&(k==='w'||k==='e'||k==='r'))setTool({w:'move',e:'rotate',r:'scale'}[k]);
});
$('#tools').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);
 if(b.dataset.a){axis=b.dataset.a;document.querySelectorAll('#tools [data-a]').forEach(x=>x.classList.toggle('on',x.dataset.a===axis))}
 if(b.dataset.o==='space'){local=!local;b.textContent=local?'Local':'World'}
 if(b.dataset.o==='snap'){snap=!snap;b.textContent=snap?'Snap on':'Snap off';b.classList.toggle('on',snap);if(tc){tc.setTranslationSnap(snap?.1:null);tc.setRotationSnap(snap?15*D:null);tc.setScaleSnap(snap?.1:null)}}
};
setNames();init3();setMode(S.mode);

function contacts(){

   let other=null;

}

/* input */

const tgt=new G.Vector3(),camT=new G.Vector3(0,1,2);

 const sdt=dt*ts,n=Math.max(1,Math.round(sdt*60)),h=sdt/n,vy0=ctl.velocity.y,wasG=onG;
 let shouldEject=false;
 if(rag)names.forEach(k=>{const p=P[k],v=p.b.velocity;p.pv=[v.x,v.y,v.z];p.t=0});

 if(inCar){

 }else if(!rag){
